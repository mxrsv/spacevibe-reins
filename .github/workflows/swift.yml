# Builds and tests the Swift app on macOS, so a cloud session that cannot compile SwiftUI still gets a real result:
# docs/plans/2026-11-03-reins-tokens.md T0. Runs only on agent branches, PRs and by hand, because macOS minutes are paid.
name: swift

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: |
            .build
            /tmp/spacevibe-build-dev-fixture
          key: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Test
        run: scripts/test.sh

      # No signing identity exists here, so this signs ad-hoc. AGENTS.md B1: the binary must report minos 15.0.
      - name: Build the app
        run: scripts/build-app.sh | tee "$RUNNER_TEMP/build.log"

      - name: Check the deployment target
        run: grep -E 'minos 15\.0' "$RUNNER_TEMP/build.log"

      # Synthetic home only (scripts/dev-fixture.sh): nothing real exists on this machine.
      - name: Screenshots
        run: |
          for screen in shell loadout rules activity; do
            SPACEVIBE_SHOT_SCREEN=$screen scripts/dev-fixture.sh --shots "$RUNNER_TEMP/shots/$screen"
          done
          for variant in typical edge; do
            SPACEVIBE_FIXTURE_LIMITS=$variant SPACEVIBE_SHOT_SCREEN=limits scripts/dev-fixture.sh --shots "$RUNNER_TEMP/shots/limits-$variant"
          done
          if [ -d Sources/SpaceVibe/TokenUsage ]; then
            SPACEVIBE_SHOT_SCREEN=tokens scripts/dev-fixture.sh --shots "$RUNNER_TEMP/shots/tokens"
          fi
          # Agents plan A10: one fixture home per Codex permission model, behind the development switch.
          if [ -d Sources/SpaceVibe/Agents ]; then
            for variant in legacy profiles both; do
              SPACEVIBE_AGENTS=1 SPACEVIBE_FIXTURE_AGENTS=$variant SPACEVIBE_SHOT_SCREEN=agents scripts/dev-fixture.sh --shots "$RUNNER_TEMP/shots/agents-$variant"
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: warn
