appId: dev.spacevibe.reins
productName: Reins
directories:
  output: release
# The renderer and main bundles are built into out/. core/ ships as plain files and is unpacked
# from the asar because its usage scan runs as a Worker, which needs a real path on disk.
files:
  - out/**
  - core/**
  - '!core/**/*.test.mjs'
  - package.json
asarUnpack:
  - core/**
mac:
  target: dir
  category: public.app-category.developer-tools
  identity: null
# No auto-updater: no publish block and no electron-updater dependency.
