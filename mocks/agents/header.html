.picker{position:absolute;top:53px;left:0;width:372px;padding:12px;background:#282c31;border-radius:12px;box-shadow:0 18px 60px #0008;z-index:30}.picker[hidden]{display:none}.search-wrap{display:flex;align-items:center;gap:10px;background:#1c1f23;border:1px solid #454c54;border-radius:6px;padding:9px 11px;margin-bottom:13px;color:var(--muted)}.search-wrap svg{width:17px;height:17px}.search-wrap input{border:0;outline:0;background:none;color:var(--text);min-width:0;width:100%;font-size:12px}.search-wrap input::placeholder{color:#a4aab2}.picker-label{padding:0 9px 7px;color:#a5acb5;font-size:12px}.agent-option{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:6px;background:none;text-align:left}.agent-option[aria-selected=true]{background:#37453f}.agent-option strong{font-weight:500;display:block;font-size:13px}.agent-option small{display:block;color:#acb3bc;font-size:12px;margin-top:1px}.agent-option .status{margin-left:auto;font-size:12px;color:#b6bec6}.agent-option .check{margin-left:auto;width:16px;color:var(--accent)}.picker-foot{border-top:1px solid #41464d;color:#aab1ba;font-size:12px;margin:10px -12px -12px;padding:11px 21px}.no-results{padding:20px 10px;color:var(--muted)}
.rail{width:94px;position:fixed;inset:72px auto 0 0;background:var(--rail);border-right:1px solid var(--line);padding:25px 10px 15px;display:flex;flex-direction:column;gap:7px}.rail button{border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:none;color:#a5acb5;font-size:12px;font-weight:500}.rail button svg{width:21px;height:21px}.rail button[aria-current=page]{background:var(--selected);color:#d1e5da}.rail .settings{margin-top:auto}.main{margin:72px 0 0 94px;padding:34px 42px 25px;max-width:1720px}.page-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.page-heading p{color:var(--muted);font-size:12px;margin-top:7px}.quiet-button{display:flex;align-items:center;gap:7px;background:none;border:1px solid #44494f;border-radius:6px;padding:7px 11px;font-size:12px}.quiet-button svg{width:14px;height:14px}.workspace{display:grid;grid-template-columns:259px minmax(0,1fr);min-height:610px;border-top:1px solid var(--line)}.outline{border-right:1px solid var(--line);padding:24px 20px 20px 0}.outline-title{font-size:12px;color:var(--muted);padding:0 12px 13px}.source{width:100%;text-align:left;background:none;border-radius:6px;padding:13px 12px;display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}.source[aria-current=true]{background:#2b3035}.source svg{width:17px;height:17px;color:#b8c0c8;margin-top:1px}.source>span:not(.count){display:block;min-width:0;flex:1}.source b{display:block;font-weight:500;font-size:12px}.source small{display:block;font-size:12px;color:#a5adb6;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source .count{margin-left:auto;font-size:12px;color:#a5adb6}.outline-note{font-size:12px;line-height:1.6;color:var(--muted);margin:29px 12px 0;max-width:190px}.outline-note svg{width:14px;height:14px;vertical-align:-3px;margin-right:4px}.detail{padding:25px 0 20px 34px;min-width:0}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:6px}.path{color:#a3abb4;font-size:12px;word-break:break-all}.badge{font-size:12px;color:#b7c9bf;border:1px solid #43554a;border-radius:4px;padding:3px 7px;white-space:nowrap}.section-caption{margin-top:29px;margin-bottom:11px;color:#aab1b9;font-size:12px}.setting{padding:18px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(160px,1fr) 205px;gap:25px;align-items:start}.setting h3 code{font-size:12px;color:#d8ddd9}.setting p{font-size:12px;color:#a5adb6;max-width:360px;margin-top:5px;line-height:1.65}.value{border:1px solid #444a51;border-radius:6px;padding:9px 12px;color:#e0e5e1;background:#24282c;display:flex;align-items:center;justify-content:space-between;font-size:12px}.value svg{width:13px;height:13px;color:#88929c}.value.boolean{color:#c0d6cb}.value.boolean svg{width:16px;height:16px;color:#b7d3c3}.source-block{background:#1d2023;border:1px solid #363b40;border-radius:7px;margin-top:25px;overflow:hidden}.source-block-head{padding:10px 15px;border-bottom:1px solid #34393e;display:flex;justify-content:space-between;color:#a2aab3;font-size:12px}.source-block pre{padding:15px 17px;margin:0;color:#c4cec7;font:12px/1.9 var(--mono);overflow:auto}.source-block pre .comment{color:#929da7}.detail-footer{display:flex;align-items:center;gap:7px;font-size:12px;color:#99a49d;margin-top:20px}.detail-footer svg{width:13px;height:13px}.bottomline{display:flex;align-items:center;justify-content:space-between;margin-top:21px;color:#7f8994;font-size:12px}.table-head,.skill-row{display:grid;grid-template-columns:minmax(180px,1fr) 130px 95px;gap:15px;align-items:center}.table-head{font-size:12px;color:#a3adb6;padding:13px 0;border-bottom:1px solid var(--line)}.skill-row{padding:20px 0;border-bottom:1px solid var(--line);font-size:12px}.skill-name{display:flex;gap:12px;align-items:center}.skill-name svg{color:#a6bdb0;width:18px}.skill-name b{font-weight:500;font-size:12px}.skill-name small{display:block;color:#a3adb6;margin-top:4px;font-size:12px}.skill-row>span{color:#a5afb7}.scope-tag{color:#c2c9c4!important}.intro{color:#a8b0b8;margin-top:8px;font-size:12px;max-width:64ch;line-height:1.7}.permission{display:flex;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.permission .pill{font-size:12px;padding:2px 7px;background:#303b34;color:#c3d6c9;border-radius:4px;min-width:44px;text-align:center}.permission code{color:#d1d7d2}.permission .ask{background:#3d372b;color:#d8cbb0}.permission .deny{background:#3c2e30;color:#d8b9bb}.hook-row{padding:13px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px}.hook-row span{color:#a3acb7}.concept-state{max-width:620px;margin:84px auto}.concept-state svg{width:34px;height:34px;color:#a4b7ac;margin-bottom:22px}.concept-state h2{font-size:24px}.concept-state p{font-size:13px;color:#b0b7bf;max-width:55ch;margin-top:13px;line-height:1.8}.concept-state .concept-line{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:#949fa9}.empty{color:#a4adb6;padding:22px 0;font-size:12px}
@media(min-width:1400px){.main{padding:40px 54px 25px}.workspace{grid-template-columns:280px minmax(0,1fr)}.detail{padding-left:44px}.setting{grid-template-columns:minmax(230px,1fr) 240px}.workspace{min-height:640px}.setting{padding:22px 0}}
@media(max-width:1150px){.main{padding:30px 30px 20px}.workspace{grid-template-columns:220px minmax(0,1fr);min-height:590px}.detail{padding-left:27px}.setting{grid-template-columns:minmax(160px,1fr) 170px;gap:16px}.toolbar{padding-right:25px}.key-hint{display:none}.setting p{font-size:12px}.source{padding-left:10px}.table-head,.skill-row{grid-template-columns:minmax(140px,1fr) 100px 70px}.workspace{min-height:570px}}
@media(max-width:760px){.local,.slash,.brand span{display:none}.toolbar{gap:16px;padding-left:24px}.rail{width:76px}.main{margin-left:76px;padding:26px 20px}.workspace{grid-template-columns:1fr}.outline{display:none}.detail{padding-left:0}.setting{grid-template-columns:1fr 160px}.page-heading{gap:15px}.picker{position:fixed;left:20px;top:65px;max-width:calc(100vw - 40px)}.toolbar-right{gap:0}.demo{font-size:12px}.agent-toggle{min-width:165px}}
@media(prefers-reduced-motion:no-preference){.picker{animation:reveal .18s cubic-bezier(.2,.8,.2,1)}@keyframes reveal{from{transform:translateY(-6px);opacity:.4}to{transform:translateY(0);opacity:1}}}

<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="i-reins" viewBox="0 0 24 24"><path d="M5 5h7a5 5 0 0 1 0 10H5V5Zm0 10v5m7-5 6 5M9 9h4"/></symbol>
<symbol id="i-agent" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 4l-4 16"/></symbol>
<symbol id="i-claude" viewBox="0 0 24 24"><path d="m12 2 0 20M2 12h20M5 5l14 14M5 19 19 5m-9-2 4 18M3 9l18 6M3 16l18-8"/></symbol>
<symbol id="i-concept" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M9 12h6m-3-3v6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-rules" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8m-8 4h8m-8 4h4"/></symbol>
<symbol id="i-skills" viewBox="0 0 24 24"><path d="m12 3 8 4v10l-8 4-8-4V7l8-4Zm0 9 8-5m-8 5L4 7m8 5v9"/></symbol>
<symbol id="i-hooks" viewBox="0 0 24 24"><path d="M8 4v10a5 5 0 0 0 10 0V8m-14 0 4-4 4 4m2 0h8"/></symbol>
<symbol id="i-usage" viewBox="0 0 24 24"><path d="M4 20h16M6 16v-5m6 5V4m6 12V8"/></symbol>
<symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l3 3h9v12H3V7Z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
</defs></svg>
<header class="toolbar">
<div class="brand"><svg aria-hidden="true"><use href="#i-reins"/></svg><span>Reins</span></div><span class="slash" aria-hidden="true">/</span>
<div class="agent-wrap">
<button id="agent-toggle" class="agent-toggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="agent-list" aria-label="Switch agent, Codex"><span class="agent-mark"><svg aria-hidden="true"><use href="#i-agent"/></svg></span><span id="selected-agent">Codex</span><svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<div id="agent-picker" class="picker" hidden><div class="search-wrap"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="agent-search" placeholder="Find an agent…" aria-label="Find an agent" autocomplete="off"></div><div class="picker-label">AGENTS ON THIS MAC</div><div id="agent-list" role="listbox" aria-label="Agent"></div><div class="picker-foot">Selection applies across all sections.</div></div>
</div>
<div class="toolbar-right"><span class="local"><svg aria-hidden="true"><use href="#i-lock"/></svg>Local on this Mac</span><span class="demo">Demo data</span></div>
</header>
<nav class="rail" aria-label="Sections">
<button data-section="rules" aria-current="page"><svg aria-hidden="true"><use href="#i-rules"/></svg>Rules</button>
<button data-section="skills"><svg aria-hidden="true"><use href="#i-skills"/></svg>Skills</button>
<button disabled title="Hooks is outside this navigation demo"><svg aria-hidden="true"><use href="#i-hooks"/></svg>Hooks</button>
<button disabled title="Subagents is outside this navigation demo"><svg aria-hidden="true"><use href="#i-team"/></svg>Subagents</button>
<button disabled title="Usage is outside this navigation demo"><svg aria-hidden="true"><use href="#i-usage"/></svg>Usage</button>
<button class="settings" disabled title="Settings is outside this navigation demo"><svg aria-hidden="true"><use href="#i-settings"/></svg>Settings</button>
</nav>
<main class="main" id="main"></main>
<script>
const agents=[{id:'claude',name:'Claude Code',icon:'claude',path:'~/.claude',available:true},{id:'codex',name:'Codex',icon:'agent',path:'~/.codex',available:true},{id:'gemini',name:'Gemini CLI',icon:'concept'},{id:'cursor',name:'Cursor',icon:'concept'},{id:'opencode',name:'OpenCode',icon:'concept'},{id:'copilot',name:'Copilot CLI',icon:'concept'}];
let selected='codex',section='rules',source='config';
const $=s=>document.querySelector(s),svg=(id,cl='')=>`<svg class="${cl}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
function drawAgents(){const q=$('#agent-search').value.toLowerCase();const matches=agents.filter(a=>a.name.toLowerCase().includes(q));$('#agent-list').innerHTML=matches.length?matches.map(a=>`<button class="agent-option" data-agent="${a.id}" role="option" aria-selected="${selected===a.id}"><span class="agent-mark">${svg(a.icon)}</span><span><strong>${a.name}</strong><small>${a.available?a.path:'Future integration'}</small></span>${selected===a.id?svg('check','check'):!a.available?'<span class="status">Concept</span>':''}</button>`).join(''):'<p class="no-results">No agents match your search.</p>'}
function closePicker(){ $('#agent-picker').hidden=true;$('#agent-toggle').setAttribute('aria-expanded','false') }
function heading(agent){return `<div class="page-heading"><div><h1>${section==='rules'?'Rules':'Skills'}</h1><p>${agent.name} <span aria-hidden="true">·</span> ${section==='rules'?'Configuration & instructions':'Reusable instructions for your agent'}</p></div>${agent.available?'<button class="quiet-button" disabled title="This preview uses synthetic files">'+svg('folder')+'Reveal in Finder</button>':'<span class="badge">Concept</span>'}</div>`}
function outline(agent){const codex=agent.id==='codex';const isSkills=section==='skills';return `<aside class="outline" aria-label="${isSkills?'Skill locations':'Rule sources'}"><div class="outline-title">${isSkills?'LOCATIONS':'SOURCES'}</div><button class="source" data-source="config" aria-current="${source==='config'}">${svg(isSkills?'folder':'settings')}<span><b>${isSkills?'Personal skills':codex?'Configuration':'Permissions & hooks'}</b><small>${agent.path}/${isSkills?'skills/':codex?'config.toml':'settings.json'}</small></span>${isSkills?'<span class="count">3</span>':''}</button>${isSkills?'':`<button class="source" data-source="instructions" aria-current="${source==='instructions'}">${svg('rules')}<span><b>Global instructions</b><small>${agent.path}/${codex?'AGENTS.md':'CLAUDE.md'}</small></span></button>`}</aside>`}
function codexConfig(){return `<div class="detail-head"><h2>Execution boundaries</h2><span class="badge">User configuration</span></div><p class="path"><code>~/.codex/config.toml</code></p><div class="section-caption">Sandbox & approvals</div><div class="setting"><div><h3><code>sandbox_mode</code></h3><p>Limit where Codex can write while it works.</p></div><div class="value">Workspace write${svg('lock')}</div></div><div class="setting"><div><h3><code>approval_policy</code></h3><p>Ask before a command needs broader access.</p></div><div class="value">On request${svg('lock')}</div></div><div class="setting"><div><h3>Network access</h3><p>Allow network requests inside the workspace sandbox.</p></div><div class="value">Disabled${svg('lock')}</div></div><div class="source-block"><div class="source-block-head"><span>CONFIGURATION SOURCE</span><span>Read-only preview</span></div><pre><span class="comment"># User configuration</span>\nsandbox_mode = "workspace-write"\napproval_policy = "on-request"\n\n[sandbox_workspace_write]\nnetwork_access = false</pre></div><p class="detail-footer">${svg('info')}Illustrative values. No files on your Mac are read or changed.</p>`}
function claudeConfig(){return `<div class="detail-head"><h2>Permissions & hooks</h2><span class="badge">User settings</span></div><p class="path"><code>~/.claude/settings.json</code></p><div class="section-caption">Tool permission rules</div><div class="permission"><span class="pill">Allow</span><code>Read</code></div><div class="permission"><span class="pill">Allow</span><code>Bash(git status:*)</code></div><div class="permission"><span class="pill ask">Ask</span><code>Bash(git push:*)</code></div><div class="permission"><span class="pill deny">Deny</span><code>Read(./.env)</code></div><div class="section-caption">Hooks</div><div class="hook-row"><h3>PreToolUse</h3><span>1 configured command</span></div><div class="hook-row"><h3>Stop</h3><span>1 configured command</span></div><p class="detail-footer">${svg('lock')}Reins displays hook configuration. It never executes a hook.</p><div class="source-block"><div class="source-block-head"><span>CONFIGURATION SOURCE</span><span>Read-only preview</span></div><pre>{ "permissions": {\n    "allow": ["Read", "Bash(git status:*)"],\n    "ask": ["Bash(git push:*)"],\n    "deny": ["Read(./.env)"]\n} }</pre></div>`}
function instructions(agent){return `<div class="detail-head"><h2>Global instructions</h2><span class="badge">${agent.id==='codex'?'AGENTS.md':'CLAUDE.md'}</span></div><p class="path"><code>${agent.path}/${agent.id==='codex'?'AGENTS.md':'CLAUDE.md'}</code></p><p class="intro">Instructions loaded for ${agent.name} across projects.</p><div class="source-block"><div class="source-block-head"><span>ILLUSTRATIVE FILE</span><span>Read-only preview</span></div><pre># Working agreements\n\n- Preserve unrelated changes in the working tree.\n- Prefer a small change over a new abstraction.\n- Verify the behavior you changed before committing.\n- Keep secrets out of logs and generated files.</pre></div><p class="detail-footer">${svg('info')}This sample belongs to ${agent.name}; it is not shared with other agents.</p>`}
function skills(agent){const items=agent.id==='codex'?[['release-check','Verify the release checklist before tagging.','SKILL.md'],['swift-review','Review Swift concurrency and ownership.','SKILL.md'],['test-first','Reproduce a bug before changing the code.','SKILL.md']]:[['commit-review','Review a change before creating a commit.','SKILL.md'],['docs-audit','Find stale behavior claims in living docs.','SKILL.md'],['security-check','Review trust boundaries and sensitive input.','SKILL.md']];return `<div class="detail-head"><h2>Personal skills</h2><span class="badge">3 installed</span></div><p class="path"><code>${agent.path}/skills/</code></p><div class="section-caption">Available to ${agent.name} across projects</div><div class="table-head"><span>SKILL</span><span>FILE</span><span>SCOPE</span></div>${items.map(([name,description,file])=>`<div class="skill-row"><div class="skill-name">${svg('skills')}<div><b>${name}</b><small>${description}</small></div></div><span><code>${file}</code></span><span class="scope-tag">Personal</span></div>`).join('')}<p class="detail-footer">${svg('info')}Synthetic inventory for this preview. Skill files are not modified.</p>`}
function render(){const agent=agents.find(a=>a.id===selected);$('#selected-agent').textContent=agent.name;$('#agent-toggle').setAttribute('aria-label','Switch agent, '+agent.name);$('.agent-toggle .agent-mark').innerHTML=svg(agent.icon);document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-current',b.dataset.section===section?'page':'false'));$('#main').innerHTML=heading(agent)+(agent.available?`<div class="workspace">${outline(agent)}<section class="detail" aria-label="${agent.name} ${section}">${section==='skills'?skills(agent):source==='instructions'?instructions(agent):selected==='codex'?codexConfig():claudeConfig()}</section></div><div class="bottomline"><span>${agent.path} <span aria-hidden="true">/</span> ${section==='rules'?'Rules':'Skills'}</span><span>All data stays on this Mac</span></div>`:`<div class="workspace"><aside class="outline"><div class="outline-title">${agent.name.toUpperCase()}</div><p class="outline-note" style="margin-top:0">Future integration</p></aside><section class="detail"><div class="concept-state">${svg('concept')}<h2>${agent.name} is a concept.</h2><p>This preview explores how more agents could fit into Reins. There is no ${section==='rules'?'configuration':'skill inventory'} adapter for ${agent.name} here.</p><p class="concept-line">Switch to Codex or Claude Code to explore their independent configuration.</p></div></section></div>`)}
$('#agent-toggle').addEventListener('click',()=>{const opening=$('#agent-picker').hidden;$('#agent-picker').hidden=!opening;$('#agent-toggle').setAttribute('aria-expanded',String(opening));if(opening){$('#agent-search').value='';drawAgents();$('#agent-search').focus()}});
$('#agent-search').addEventListener('input',drawAgents);
$('#agent-list').addEventListener('click',e=>{const button=e.target.closest('[data-agent]');if(!button)return;selected=button.dataset.agent;source='config';render();closePicker();$('#agent-toggle').focus()});
document.querySelector('.rail').addEventListener('click',e=>{const button=e.target.closest('[data-section]');if(!button)return;section=button.dataset.section;source='config';render()});
$('#main').addEventListener('click',e=>{const button=e.target.closest('[data-source]');if(!button)return;source=button.dataset.source;render();document.querySelector(`[data-source="${source}"]`)?.focus()});
document.addEventListener('click',e=>{if(!e.target.closest('.agent-wrap'))closePicker()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#agent-picker').hidden){closePicker();$('#agent-toggle').focus()}if(!$('#agent-picker').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const buttons=[...document.querySelectorAll('.agent-option')];if(!buttons.length)return;const index=buttons.indexOf(document.activeElement);buttons[e.key==='ArrowDown'?(index+1)%buttons.length:(index-1+buttons.length)%buttons.length].focus()}});
render();
</script>
</body>
</html>
