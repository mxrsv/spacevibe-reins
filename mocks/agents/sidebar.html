<style>
@font-face{font-family:Inter;src:url('assets/InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}

*{box-sizing:border-box}body{margin:0;padding:38px 44px;height:100vh;min-height:650px}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0;background:none}button:disabled{cursor:default;opacity:.42}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover:not(:disabled){background:#ffffff0b}::selection{background:#73894b;color:#fff}svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}.symbols{position:absolute;width:0;height:0;overflow:hidden}.app{height:100%;max-width:1440px;min-height:570px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid #3c4039;border-radius:13px;box-shadow:0 24px 80px #0006;overflow:hidden;background:var(--bg)}.sidebar{background:var(--side);display:flex;flex-direction:column;position:relative;border-right:1px solid #343730;padding:0 14px}.chrome{height:58px;display:flex;align-items:center;gap:8px;padding:0 7px}.dot{height:11px;width:11px;border-radius:50%;background:#ff6259}.dot:nth-child(2){background:#ffbd2e}.dot:nth-child(3){background:#29c840}.wordmark{font-size:12px;font-weight:600;margin-left:auto;letter-spacing:-.2px;color:#bfc4ba}.agent-switch{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px 10px;border:1px solid #494d43;border-radius:8px;background:#2c302a;box-shadow:0 2px 3px #0002}.agent-mark{width:30px;height:30px;border:1px solid #717966;border-radius:7px;display:grid;place-items:center;color:#e2eacb;background:#3a4132;flex:none;font-size:13px;font-weight:650;letter-spacing:-.5px}.agent-info{flex:1;min-width:0}.agent-name{font-weight:600;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-location{font-size:12px;display:block;color:#b0b8a6;margin-top:4px}.chevrons{width:13px;height:18px;color:#b4bcaa}.nav-caption{padding:29px 11px 10px;color:#a3aa9b;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.navigation{display:flex;flex-direction:column;gap:3px}.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;text-align:left;border-radius:6px;color:#bac0b4;font-weight:480}.nav-item.active{background:#3c4433;color:#e0eacb;font-weight:600}.nav-item svg{width:16px;height:16px}.nav-item .count{margin-left:auto;font-size:12px;color:#aeb6a1}.sidebar-bottom{margin-top:auto;padding:16px 9px 19px;display:flex;align-items:center;gap:9px;font-size:12px;color:#a7ae9e}.offline{height:6px;width:6px;border-radius:50%;background:#a6b78d}.demo{margin-left:auto;font-size:12px;color:#9da594}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{height:59px;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--line);gap:10px;font-size:12px;color:#b8bdb3}.toolbar .crumb-arrow{color:#6f7668;font-size:15px}.toolbar .current{color:#e2e5dd;font-weight:550}.readonly{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#b6beb0}.readonly svg{width:13px;height:13px}.content{padding:34px 40px 24px;overflow:auto;flex:1;scrollbar-color:#4f5549 transparent;scrollbar-width:thin}.page-title{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}.page-title h1{font-size:25px;font-weight:550;letter-spacing:-.7px;margin:0}.badge{font-size:12px;border:1px solid #3b4036;border-radius:4px;padding:4px 6px;color:#b6beaa;font-weight:450}.document-layout{display:grid;grid-template-columns:minmax(0,1fr) 188px;gap:35px}.file-heading{display:flex;align-items:center;gap:9px;padding:0 0 15px;border-bottom:1px solid #41473b;color:#e5eadf;font-weight:550}.file-heading svg{color:#b0bd9d}.file-label{font-size:12px;color:#a9b19d;font-weight:400;margin-left:auto}.document h2{font-size:16px;letter-spacing:-.3px;margin:28px 0 13px;font-weight:550}.document p{font-size:12px;line-height:1.85;color:#bbc2b3;max-width:67ch;margin:0 0 17px}.document ul{margin:0;padding-left:17px;color:#c5cbbd;font-size:12px;line-height:2.2}.document li::marker{color:#7b866d}.document code{font-family:Inter,sans-serif;font-size:12px;background:#2c3127;border-radius:3px;padding:2px 5px;color:#d4dfc4}.section-divider{height:1px;background:#30362b;margin:28px 0}.source-pane{padding-left:20px;border-left:1px solid var(--line);align-self:start}.source-pane h3{font-size:12px;margin:1px 0 19px;color:#d7ddce;font-weight:550}.meta-label{font-size:12px;color:#9ca58f;margin:20px 0 7px}.meta-value{font-size:12px;line-height:1.7;color:#c6ceba;overflow-wrap:anywhere}.status-line{display:flex;align-items:center;gap:6px;font-size:12px;color:#c2d1ab}.tiny-check{width:13px;height:13px}.related{display:flex;gap:7px;align-items:center;color:#aab697;font-size:12px;margin-top:11px}.related svg{width:13px;height:13px}.config-title{font-size:12px;margin:28px 0 9px;color:#d6ddcc}.config-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #2e3428;font-size:12px;gap:10px}.config-row .value{margin-left:auto;color:#d6e5b9;background:#343e29;border-radius:4px;padding:4px 7px}.config-row .key{color:#afbba0}.footbar{height:35px;border-top:1px solid var(--line);padding:0 30px;display:flex;align-items:center;color:#929d87;font-size:12px;gap:7px}.footbar svg{width:12px;height:12px}.footbar .right{margin-left:auto;color:#a6af9a}.table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}.table th{padding:0 10px 13px 0;color:#959f8b;font-size:12px;font-weight:500;border-bottom:1px solid #404735}.table td{padding:20px 10px 20px 0;border-bottom:1px solid var(--line);color:#bbc5ae}.table .skill-name{font-weight:550;color:#e0e6d6}.skill-description{font-size:12px;color:#9ba68f;margin-top:6px;line-height:1.6}.scope-chip{font-size:12px;background:#2b3225;padding:4px 7px;border-radius:4px;color:#bdcba9}.empty{padding:70px 30px;text-align:center}.empty svg{height:34px;width:34px;color:#9da98e;margin-bottom:18px}.empty h2{font-size:19px;font-weight:550;letter-spacing:-.4px;margin:0 0 12px}.empty p{font-size:12px;color:#a6b09a;line-height:1.8;max-width:42ch;margin:auto}.activity-row{display:flex;padding:20px 0;border-bottom:1px solid var(--line);gap:16px}.activity-icon{width:32px;height:32px;background:#303828;display:grid;place-items:center;border-radius:7px;color:#b7c89d}.activity-title{font-size:12px;font-weight:550}.activity-detail{font-size:12px;color:#a4b095;margin-top:7px}.activity-time{margin-left:auto;font-size:12px;color:#98a48a}.picker{position:fixed;z-index:5;width:285px;background:#2a2e27;border:1px solid #59634c;border-radius:10px;box-shadow:0 18px 45px #0008;padding:8px;display:none}.picker.open{display:block;animation:reveal 150ms cubic-bezier(.16,1,.3,1)}.search-wrap{display:flex;align-items:center;margin:1px 2px 8px;gap:8px;border-bottom:1px solid #454e3b;padding:7px 5px 13px;color:#b0bd9e}.search-wrap input{background:none;border:0;outline:none;color:#edf1e6;width:100%;font-size:12px;caret-color:var(--accent)}input::placeholder{color:#adb89e}.picker-label{font-size:12px;letter-spacing:.04em;color:#a5b294;padding:5px 8px 8px}.agent-option{display:flex;align-items:center;width:100%;padding:9px 8px;border-radius:5px;gap:10px;text-align:left}.agent-option[aria-selected=true]{background:#444f36}.agent-option .agent-mark{height:27px;width:27px;font-size:12px;background:#363f2d}.option-name{font-size:12px;flex:1}.concept{font-size:12px;color:#acb89c;border:1px solid #515d43;border-radius:3px;padding:2px 4px}.agent-option .check{height:14px;width:14px;color:#dcebbb}.no-results{font-size:12px;color:#bac5ad;padding:20px 8px}.picker-footer{font-size:12px;color:#a4b093;border-top:1px solid #424d35;margin-top:6px;padding:11px 8px 4px;display:flex;justify-content:space-between}.picker-footer kbd{font:inherit;border:1px solid #576249;border-radius:3px;padding:1px 4px;color:#c5d0b7}@keyframes reveal{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:1200px){body{padding:24px}.content{padding:30px}.document-layout{grid-template-columns:minmax(0,1fr) 155px;gap:23px}.source-pane{padding-left:17px}.app{grid-template-columns:230px minmax(0,1fr)}}@media(max-width:850px){body{padding:10px}.app{grid-template-columns:200px minmax(0,1fr)}.document-layout{display:block}.source-pane{display:none}.content{padding:24px}.toolbar{padding:0 24px}.readonly{display:none}}
.toolbar,.footbar{flex-shrink:0}.content{min-height:0}</style>
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="i-rules" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M9 12h6M9 16h6"/></symbol>
<symbol id="i-skills" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 5 8-5M12 12.5V21"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-hook" viewBox="0 0 24 24"><path d="M8 3v13a5 5 0 0 0 10 0v-3l-3 3M5 3h6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>
<div class="app">
<aside class="sidebar">
<div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="wordmark">reins</span></div>
<button class="agent-switch" id="agent-picker-trigger" aria-expanded="false" aria-controls="agent-picker" aria-haspopup="listbox"><span class="agent-mark" id="selected-mark">Co</span><span class="agent-info"><span class="agent-name" id="selected-agent">Codex</span><span class="agent-location" id="agent-root">~/.codex</span></span><svg class="chevrons" viewBox="0 0 16 20"><path d="m5 7 3-3 3 3M5 13l3 3 3-3"/></svg></button>
<div class="nav-caption" id="nav-context">Codex workspace</div>
<nav class="navigation" aria-label="Agent sections">
<button class="nav-item active" data-section="Rules" aria-current="page"><svg><use href="#i-rules"/></svg>Rules<span class="count" data-count="Rules">2</span></button>
<button class="nav-item" data-section="Skills"><svg><use href="#i-skills"/></svg>Skills<span class="count" data-count="Skills">4</span></button>
<button class="nav-item" data-section="Hooks"><svg><use href="#i-hook"/></svg>Hooks<span class="count" data-count="Hooks">—</span></button>
<button class="nav-item" data-section="Activity"><svg><use href="#i-activity"/></svg>Activity</button>
</nav>
<div class="sidebar-bottom"><span class="offline"></span>On this Mac<span class="demo">Demo data</span></div>
</aside>
<main class="main">
<div class="toolbar"><span id="toolbar-agent">Codex</span><span class="crumb-arrow">/</span><span class="current" id="toolbar-section">Rules</span><span class="readonly"><svg><use href="#i-lock"/></svg>Read-only preview</span></div>
<div class="content" id="page-content"></div>
<div class="footbar"><svg><use href="#i-folder"/></svg><span id="foot-root">~/.codex</span><span class="right">Local files · Demo data</span></div>
</main>
</div>
<div class="picker" id="agent-picker"><div class="search-wrap"><svg><use href="#i-search"/></svg><input id="agent-search" type="search" placeholder="Find an agent…" aria-label="Find an agent" autocomplete="off"></div><div class="picker-label">AGENTS ON THIS MAC</div><div id="agent-options" role="listbox" aria-label="Choose global agent"></div><div class="picker-footer"><span>One agent, across all sections</span><span><kbd>esc</kbd> close</span></div></div>
<script>
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const agents=[{name:'Claude Code',mark:'Cl',root:'~/.claude'},{name:'Codex',mark:'Co',root:'~/.codex'},{name:'Gemini CLI',mark:'Ge',concept:true},{name:'Cursor',mark:'Cu',concept:true},{name:'OpenCode',mark:'Op',concept:true},{name:'Copilot CLI',mark:'Cp',concept:true}];
let agent=agents[1],section='Rules';
const $=s=>document.querySelector(s),picker=$('#agent-picker'),trigger=$('#agent-picker-trigger');
function sourcePane(file){return `<aside class="source-pane"><h3>Source</h3><div class="status-line">${icon('check')}Readable</div><div class="meta-label">Location</div><div class="meta-value">${agent.root}/${file}</div><div class="meta-label">Scope</div><div class="meta-value">Global · ${agent.name}</div><div class="meta-label">Updated</div><div class="meta-value">Nov 4, 2026</div><div class="meta-label">Also in this workspace</div><div class="related">${icon('rules')}${agent.name==='Codex'?'config.toml':'settings.json'}</div></aside>`}
function rules(){const codex=agent.name==='Codex';return `<div class="document-layout"><article class="document"><div class="file-heading">${icon('rules')}AGENTS.md<span class="file-label">Global instructions</span></div><h2>A careful collaborator</h2><p>Keep changes focused, preserve existing work, and leave every task easier to review.</p><h2>Working agreements</h2><ul><li>Read the relevant code before making a change.</li><li>Use native tools before adding a dependency.</li><li>Verify the behavior you changed.</li><li>Keep credentials out of source and logs.</li></ul><div class="section-divider"></div><div class="file-heading">${icon('lock')}${codex?'config.toml':'settings.json'}<span class="file-label">${codex?'Codex execution':'Claude permissions'}</span></div><div class="config-title">${codex?'Execution policy':'Permission rules'}</div>${codex?'<div class="config-row"><span class="key">sandbox_mode</span><span class="value">workspace-write</span></div><div class="config-row"><span class="key">approval_policy</span><span class="value">on-request</span></div>':'<div class="config-row"><span class="key">permissions.allow</span><span class="value">Read · Glob · Grep</span></div><div class="config-row"><span class="key">permissions.ask</span><span class="value">Bash</span></div><div class="config-row"><span class="key">permissions.deny</span><span class="value">Read(.env)</span></div>'}</article>${sourcePane(codex?'AGENTS.md':'CLAUDE.md')}</div>`}
function skills(){let names=agent.name==='Codex'?['code-review','release-notes','swift-testing','write-docs']:['code-review','diagnose-bugs','swift-testing'];let desc={'code-review':'Review a change against its callers and tests.','release-notes':'Prepare a focused summary for the next release.','diagnose-bugs':'Trace a reported problem before changing the code.','swift-testing':'Verify Swift behavior in a temporary home.','write-docs':'Keep project documentation close to the code.'};return `<table class="table"><thead><tr><th>SKILL</th><th>SCOPE</th><th>SOURCE</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td><div class="skill-name">${n}</div><div class="skill-description">${desc[n]}</div></td><td><span class="scope-chip">Global</span></td><td>${agent.root}/skills</td></tr>`).join('')}</tbody></table>`}
function hooks(){return agent.name==='Claude Code'?`<table class="table"><thead><tr><th>EVENT</th><th>COMMAND</th><th>SOURCE</th></tr></thead><tbody><tr><td class="skill-name">PreToolUse</td><td>scripts/check-files.sh</td><td>settings.json</td></tr><tr><td class="skill-name">Stop</td><td>scripts/session-note.sh</td><td>settings.json</td></tr></tbody></table>`:`<div class="empty">${icon('hook')}<h2>No hooks in this preview</h2><p>This concept does not map Claude Code hooks to Codex settings.</p></div>`}
function activity(){return `<div class="activity-row"><span class="activity-icon">${icon('clock')}</span><div><div class="activity-title">Refine the project setup</div><div class="activity-detail">${agent.name} · ~/Projects/sample-app</div></div><span class="activity-time">Today, 10:42</span></div><div class="activity-row"><span class="activity-icon">${icon('clock')}</span><div><div class="activity-title">Review the test fixtures</div><div class="activity-detail">${agent.name} · ~/Projects/sample-app</div></div><span class="activity-time">Yesterday</span></div>`}
function render(){const concept=agent.concept;$('#selected-mark').textContent=agent.mark;$('#selected-agent').textContent=agent.name;$('#agent-root').textContent=concept?'Concept · not connected':agent.root;$('#nav-context').textContent=agent.name+' workspace';$('#toolbar-agent').textContent=agent.name;$('#toolbar-section').textContent=section;$('#foot-root').textContent=concept?'Concept preview':agent.root;document.querySelectorAll('[data-section]').forEach(b=>{const active=b.dataset.section===section;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const counts=concept?{Rules:'—',Skills:'—',Hooks:'—'}:agent.name==='Codex'?{Rules:'2',Skills:'4',Hooks:'—'}:{Rules:'2',Skills:'3',Hooks:'2'};document.querySelectorAll('[data-count]').forEach(e=>e.textContent=counts[e.dataset.count]);$('#page-content').innerHTML=`<div class="page-title"><h1>${section}</h1><span class="badge">${concept?'Concept':agent.name}</span></div>`+(concept?`<div class="empty">${icon('folder')}<h2>${agent.name} is a future direction</h2><p>Configuration is not connected. Choose Claude Code or Codex to explore this mock.</p></div>`:({Rules:rules,Skills:skills,Hooks:hooks,Activity:activity}[section]()));if(!concept&&agent.name==='Claude Code'&&section==='Rules')$('.document .file-heading').innerHTML=icon('rules')+'CLAUDE.md<span class="file-label">Global instructions</span>'}
function options(){const query=$('#agent-search').value.toLowerCase().trim();const list=agents.filter(a=>a.name.toLowerCase().includes(query));$('#agent-options').innerHTML=list.length?list.map(a=>`<button class="agent-option" role="option" aria-selected="${a.name===agent.name}" data-agent="${a.name}"><span class="agent-mark">${a.mark}</span><span class="option-name">${a.name}</span>${a.concept?'<span class="concept">Concept</span>':''}${a.name===agent.name?'<svg class="check"><use href="#i-check"/></svg>':''}</button>`).join(''):'<div class="no-results">No agents found</div>'}
function closePicker(){picker.classList.remove('open');trigger.setAttribute('aria-expanded','false')}
trigger.addEventListener('click',()=>{if(picker.classList.contains('open')){closePicker();return}const r=trigger.getBoundingClientRect();picker.style.left=r.left+'px';picker.style.top=(r.bottom+7)+'px';$('#agent-search').value='';options();picker.classList.add('open');trigger.setAttribute('aria-expanded','true');$('#agent-search').focus()});
$('#agent-search').addEventListener('input',options);
$('#agent-options').addEventListener('click',e=>{const b=e.target.closest('[data-agent]');if(!b)return;agent=agents.find(a=>a.name===b.dataset.agent);closePicker();render();trigger.focus()});
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{section=b.dataset.section;render()}));
document.addEventListener('click',e=>{if(!picker.contains(e.target)&&!trigger.contains(e.target))closePicker()});
document.addEventListener('keydown',e=>{if(!picker.classList.contains('open'))return;if(e.key==='Escape'){closePicker();trigger.focus()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const choices=[...document.querySelectorAll('.agent-option')];if(!choices.length)return;const current=choices.indexOf(document.activeElement);choices[current<0?(e.key==='ArrowDown'?0:choices.length-1):(current+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length].focus()}});
window.addEventListener('resize',closePicker);render();
</script>
</body>
</html>
