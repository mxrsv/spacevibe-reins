approval_policy = "never"
sandbox_mode = "danger-full-access"
default_permissions = "dev"
approvals_reviewer = "user"
developer_instructions = """
sandbox_mode = "read-only"
[permissions.fake]
"""

[sandbox_workspace_write]
network_access = true
writable_roots = ["/work/a", "/work/b"]

[permissions.dev.filesystem]
"/work" = "write"
"~/.ssh" = "none"

[permissions.dev.network]
enabled = true
mode = "limited"

[permissions.strict.filesystem]
"/" = "read"

[projects."$HOME/proj-open"]
trust_level = "trusted"

[projects."$HOME/proj-bare"]
trust_level = "untrusted"

[projects."$HOME/proj-broken"]
trust_level = "trusted"

[projects."$HOME/proj-null"]
trust_level = "trusted"

[projects]
"/work/inline" = { trust_level = "trusted" }

[mcp_servers.github]
command = "npx"

[mcp_servers.github.env]
GITHUB_TOKEN = "canary-secret-9f3a1c"

[shell_environment_policy]
set = { API_KEY = "canary-secret-9f3a1c" }
